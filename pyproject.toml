[project]
name = "actuate-ai"
version = "0.1.0"
description = "Closed-loop graphs for AI generation, validation, and training rewards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Actuate Contributors" }]
keywords = ["llm", "agents", "graph", "control-loop", "reward", "evaluation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "networkx>=3.2",
]

[project.optional-dependencies]
engine = ["networkx>=3.2"]
plants = ["litellm>=1.40", "openai>=1.0"]
sensors = ["jsonschema>=4.21", "sentence-transformers>=2.6"]
memory = ["chromadb>=0.5", "faiss-cpu>=1.8"]
telemetry = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24", "mlflow>=2.12", "pandas>=2.2"]
persistence = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
dsl = ["pyyaml>=6.0"]
capabilities = ["pluggy>=1.5"]
ui = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "websockets>=12.0", "httpx>=0.27"]
all = ["actuate-ai[engine,plants,sensors,memory,telemetry,persistence,dsl,capabilities,ui]"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
actuate = "actuate.api.app:run"
actuate-bootstrap = "actuate.persistence.bootstrap:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actuate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "litellm"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true
